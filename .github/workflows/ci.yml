name: CI

on:
  push:
    branches: [ lab9, main, master ]
  pull_request:
    branches: [ lab9, main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Warehouse.sln

      - name: Build
        run: dotnet build Warehouse.sln -c Release --no-restore

      - name: Test
        env:
          Jwt__Key: WarehouseLabJwtSecretKey_ChangeMe_32+chars!
        run: dotnet test WarehouseApi.Tests/WarehouseApi.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish API
        run: dotnet publish WarehouseApi/WarehouseApi.csproj -c Release -o artifacts/api --no-build

      - name: Publish Blazor
        run: dotnet publish Warehouse.Blazor/Warehouse.Blazor.csproj -c Release -o artifacts/blazor --no-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-publish
          path: artifacts/

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f Dockerfile.api -t warehouse-api:ci .

      - name: Build Blazor image
        run: docker build -f Dockerfile.blazor -t warehouse-blazor:ci .
